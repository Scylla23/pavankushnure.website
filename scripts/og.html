<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Inter; src: url('../public/fonts/inter-400.woff2'); font-weight: 400 }
  @font-face { font-family: Inter; src: url('../public/fonts/inter-500.woff2'); font-weight: 500 }
  @font-face { font-family: Inter; src: url('../public/fonts/inter-600.woff2'); font-weight: 600 }

  * { margin: 0; box-sizing: border-box }
  body {
    width: 1200px; height: 630px; display: flex; overflow: hidden;
    font-family: Inter, sans-serif; background: #100904; color: #ffedd7;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(90vw 70vh at 100% -20%, rgba(220,80,0,.16), transparent 60%);
  }
  .copy {
    position: relative; flex: 1; padding: 64px;
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 17px; font-weight: 500; letter-spacing: .1em;
    text-transform: uppercase; color: #dc5000;
  }
  .eyebrow::before { content: ''; width: 34px; border-top: 1px dashed #dc5000 }
  h1 { font-size: 62px; font-weight: 600; line-height: 1.02; letter-spacing: -.02em }
  .sub { font-size: 23px; color: #a3907c; line-height: 1.45; max-width: 20ch }
  .proof {
    display: flex; gap: 26px; font-size: 15px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase; color: #a3907c;
    border-top: 1px dashed #40372e; padding-top: 20px; margin-top: 6px;
  }
  .shot { position: relative; width: 430px; flex: none }
  .shot img { width: 100%; height: 630px; object-fit: cover; object-position: 50% 22% }
  /* Fade the photo into the canvas instead of butting a hard seam against it. */
  .shot::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, #100904 0%, rgba(16,9,4,.45) 22%, transparent 55%);
  }
</style>

<div class="copy">
  <div class="eyebrow">Lead AI Engineer</div>
  <h1>I build AI-powered SaaS products, end to end.</h1>
  <div class="sub">Pavan Kushnure — remote, with US startups.</div>
  <div class="proof"><span>3+ years</span><span>10 shipped products</span><span>pavankushnure.website</span></div>
</div>
<div class="shot"><img src="../public/img/hero-1200.webp" alt="" /></div>
